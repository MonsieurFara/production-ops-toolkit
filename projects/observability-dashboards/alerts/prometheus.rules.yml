groups:
  - name: production-lab
    rules:
      - alert: ExporterUnavailable
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Exporter inaccessible depuis cinq minutes
      - alert: LowAvailableMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Moins de dix pour cent de mémoire disponible
      - alert: ElevatedServerErrors
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.01) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Taux d'erreurs serveur élevé sur les services du laboratoire
